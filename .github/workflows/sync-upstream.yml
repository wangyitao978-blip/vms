name: Restore original vmios sources and build clean APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write
  actions: read

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download previously built QEMU engine only
        uses: actions/download-artifact@v4
        with:
          name: vms-android-arm64-with-qemu
          path: /tmp/vmios-qemu-engine
          repository: ${{ github.repository }}
          run-id: 42419417751
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout exact upstream source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/LQS686/vmios.git "$RUNNER_TEMP/vmios-upstream"

      - name: Replace repository contents with upstream main
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/vmios-upstream/" "$GITHUB_WORKSPACE/"
          diff -qr --exclude='.git' "$RUNNER_TEMP/vmios-upstream" "$GITHUB_WORKSPACE"
          git status --short

      - name: Commit exact upstream source tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore exact LQS686/vmios upstream source tree"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Stage QEMU engine without any XNU payload
        run: |
          set -euo pipefail
          QEMU="$(find /tmp/vmios-qemu-engine -type f -name qemu-system-aarch64 -print -quit)"
          test -n "$QEMU"
          ENGINE_DIR="$(dirname "$QEMU")"
          DEST="android/app/src/main/assets/engine/arm64-v8a"
          mkdir -p "$DEST"
          cp -a "$ENGINE_DIR"/. "$DEST"/
          rm -f android/app/src/main/assets/demo/payload.bin
          echo "QEMU engine files:"
          find "$DEST" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -x "$DEST/qemu-system-aarch64"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build original Android app
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK contains no XNU or system payload
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK assets:"
          unzip -Z1 "$APK" | grep '^assets/' || true
          if unzip -Z1 "$APK" | grep -Ei '(^|/)(payload\.bin|kernel[^/]*|DeviceTree[^/]*|.*\.im4p|.*\.dmg)$'; then
            echo "Unexpected XNU/kernel/system payload found in APK" >&2
            exit 1
          fi
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload clean APK
        uses: actions/upload-artifact@v4
        with:
          name: vmios-original-source-apk-no-xnu
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
