name: Publish Android APK release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-android-release.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful Android build artifact
        uses: actions/download-artifact@v4
        with:
          name: vms-android-arm64-with-qemu
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42373036050

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find release-assets -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No APK found in the downloaded artifact"
            find release-assets -maxdepth 3 -type f -print
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-arm64-2026.11.07
          name: VMS Android ARM64 — 2026-11-07
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
