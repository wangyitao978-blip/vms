name: Build upstream QEMU payload from original XNU artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-payload-original.yml'

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download original upstream XNU kernel artifact
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/LQS686/vmios/actions/artifacts/12584111088/zip" \
            -o /tmp/upstream-xnu-kernel.zip
          unzip -oq /tmp/upstream-xnu-kernel.zip 'kernel.development.sweet' -d /tmp/upstream-xnu
          test -s /tmp/upstream-xnu/kernel.development.sweet
          sha256sum /tmp/upstream-xnu/kernel.development.sweet

      - name: Install ipsw utility
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install ipsw
        run: |
          set -euo pipefail
          go install github.com/blacktop/ipsw/cmd/ipsw@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Extract the original D22AP product tree from the iOS 16.7.16 IPSW
        run: |
          set -euo pipefail
          mkdir -p research/ipsw-x/dt
          python3 - <<'PY' > /tmp/ipsw-url
          import json, urllib.request
          data = json.load(urllib.request.urlopen(
              "https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw", timeout=60))
          matches = [x for x in data["firmwares"] if x.get("buildid") == "20H392"]
          if not matches:
              raise SystemExit("iPhone10,3 build 20H392 was not found in ipsw.me")
          print(matches[0]["url"])
          PY
          IPSW_URL="$(cat /tmp/ipsw-url)"
          python3 tools/remotezip.py "$IPSW_URL" DeviceTree.d22ap.im4p research/ipsw-x/dt
          ipsw img4 im4p extract \
            research/ipsw-x/dt/Firmware/all_flash/DeviceTree.d22ap.im4p \
            -o research/ipsw-x/d22ap.adt
          test -s research/ipsw-x/d22ap.adt
          ls -lh research/ipsw-x/d22ap.adt

      - name: Build original QEMU ADT and SWEETXNU payload
        run: |
          set -euo pipefail
          python3 tools/mkadt.py qemu.adt --qemu --qemu-cpus 2
          python3 tools/mkpayload.py \
            /tmp/upstream-xnu/kernel.development.sweet \
            qemu.adt sweet-qemu-payload.bin --profile vm
          file qemu.adt sweet-qemu-payload.bin
          sha256sum sweet-qemu-payload.bin
          ls -lh qemu.adt sweet-qemu-payload.bin

      - name: Upload separate XNU payload (not part of APK)
        uses: actions/upload-artifact@v4
        with:
          name: vmios-original-qemu-payload
          path: |
            sweet-qemu-payload.bin
            qemu.adt
          if-no-files-found: error
          retention-days: 30
