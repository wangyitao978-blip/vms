name: Build Android QEMU engine

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["xnu"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "vm/qemu/**"
      - "vm/README.md"
      - ".github/workflows/qemu-android.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config python3 python3-venv \
            git wget curl gzip dpkg-dev libglib2.0-dev libpixman-1-dev device-tree-compiler \
            libfdt-dev libslirp-dev

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK r27 and Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Fetch Termux aarch64 sysroot packages
        run: |
          set -euo pipefail
          mkdir -p /tmp/termux-debs /tmp/termux-root
          python3 - <<'PY'
          import gzip, urllib.request, email, re, os, subprocess
          base = "https://packages.termux.dev/apt/termux-main/"
          index_url = base + "dists/stable/main/binary-aarch64/Packages.gz"
          data = gzip.decompress(urllib.request.urlopen(index_url, timeout=60).read()).decode()
          packages = {}
          for block in data.split("\n\n"):
              if not block.strip():
                  continue
              msg = email.message_from_string(block)
              name = msg.get("Package")
              if name:
                  packages[name] = msg
          roots = ["glib", "libpixman", "pcre2", "libffi", "libiconv", "libandroid-support", "zlib"]
          todo, selected = list(roots), set()
          while todo:
              name = todo.pop()
              if name in selected:
                  continue
              if name not in packages:
                  raise SystemExit("Missing Termux package: " + name)
              msg = packages[name]
              selected.add(name)
              for dep in msg.get("Depends", "").split(","):
                  dep = dep.strip().split("|")[0].strip()
                  dep = re.sub(r"\s*\([^)]*\)", "", dep).strip()
                  dep = re.sub(r":any$", "", dep)
                  if dep and dep in packages and dep not in selected:
                      todo.append(dep)
          print("Termux packages:", ", ".join(sorted(selected)))
          for name in sorted(selected):
              filename = packages[name].get("Filename")
              if not filename:
                  raise SystemExit("No Filename for " + name)
              url = base + filename
              out = "/tmp/termux-debs/" + os.path.basename(filename)
              urllib.request.urlretrieve(url, out)
              subprocess.run(["dpkg-deb", "-x", out, "/tmp/termux-root"], check=True)
          PY
          test -d /tmp/termux-root/data/data/com.termux/files/usr/lib
          du -sh /tmp/termux-root

      - name: Create Android cross toolchain wrappers
        run: |
          set -euo pipefail
          NDK="$NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          WRAPPERS="$RUNNER_TEMP/android-cross"
          mkdir -p "$WRAPPERS"
          cat > "$WRAPPERS/gcc" <<EOF
          #!/bin/sh
          exec "$TOOLCHAIN/aarch64-linux-android24-clang" "\$@"
          EOF
          cat > "$WRAPPERS/g++" <<EOF
          #!/bin/sh
          exec "$TOOLCHAIN/aarch64-linux-android24-clang++" "\$@"
          EOF
          for tool in ar nm strip ranlib objcopy; do
            cat > "$WRAPPERS/$tool" <<EOF
          #!/bin/sh
          exec "$TOOLCHAIN/llvm-$tool" "\$@"
          EOF
          done
          cat > "$WRAPPERS/ld" <<EOF
          #!/bin/sh
          exec "$TOOLCHAIN/ld.lld" "\$@"
          EOF
          chmod +x "$WRAPPERS"/*
          cat > "$RUNNER_TEMP/termux-pkg-config" <<'EOF'
          #!/bin/sh
          export PKG_CONFIG_SYSROOT_DIR=/tmp/termux-root
          export PKG_CONFIG_LIBDIR=/tmp/termux-root/data/data/com.termux/files/usr/lib/pkgconfig:/tmp/termux-root/data/data/com.termux/files/usr/share/pkgconfig
          exec pkg-config "$@"
          EOF
          chmod +x "$RUNNER_TEMP/termux-pkg-config"
          echo "CROSS_WRAPPERS=$WRAPPERS" >> "$GITHUB_ENV"
          echo "PKG_CONFIG=$RUNNER_TEMP/termux-pkg-config" >> "$GITHUB_ENV"

      - name: Fetch and patch QEMU 8.2.0
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v8.2.0 https://github.com/qemu/qemu.git qemu
          cp vm/qemu/sweet_ufs.c vm/qemu/sweet_touch.c vm/qemu/sweet_fb.c qemu/hw/block/
          git -C qemu apply "$GITHUB_WORKSPACE/vm/qemu/qemu-sweet.patch"
          # Android NDK Clang 18 is supported; QEMU's compile-probe rejects
          # this toolchain because the cross compiler probe is not reliable.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("qemu/meson.build")
          s = p.read_text()
          # QEMU's Clang version check uses compiler.compiles(), which can
          # fail under Meson's Android cross configuration despite NDK Clang 18.
          # Replace the probe with a direct compiler-ID check.
          start = s.index("  elif compiler.get_id() == 'clang' and compiler.compiles('''")
          end = s.index("  else\n    error('You either need GCC", start)
          s = s[:start] + "  elif compiler.get_id() == 'clang'\n    # ok\n" + s[end:]
          # Android does not use QEMU's optional SafeStack instrumentation.
          # Skip the compiler probe: NDK Clang rejects -fno-sanitize=safe-stack.
          start = s.index("# Compiles if SafeStack *not* enabled")
          end = s.index("if get_option('safe_stack') and coroutine_backend", start)
          s = s[:start] + s[end:]
          # Meson's GLib size_t probe is unreliable with the Termux sysroot
          # under the NDK cross file. The selected ABI is explicitly aarch64,
          # and the Termux glibconfig.h declares GLIB_SIZEOF_SIZE_T=8.
          start = s.index("if not cc.compiles('''\n  #include <glib.h>\n  #include <unistd.h>")
          end = s.index("# Silence clang warnings triggered by glib < 2.57.2", start)
          s = s[:start] + "# Android ARM64: verified NDK/GLib size_t ABI (64-bit).\n\n" + s[end:]
          # Android Bionic defines struct iovec in sys/uio.h. Meson's
          # cross has_type probe misses it, which makes osdep.h redeclare it.
          import re
          pattern = r"config_host_data\.set\('CONFIG_IOVEC',\s*cc\.has_type\('struct iovec',\s*prefix: '#include <sys/uio\.h>'\)\)"
          s, count = re.subn(pattern, "config_host_data.set('CONFIG_IOVEC', true)", s, count=1)
          if count != 1:
              raise SystemExit("Could not locate QEMU CONFIG_IOVEC probe")
          p.write_text(s)
          PY

      - name: Configure and build Android ARM64 QEMU
        working-directory: qemu
        env:
          SYSROOT: /tmp/termux-root
        run: |
          set -euo pipefail
          mkdir build-android
          cd build-android
          set +e
          {
            PKG_CONFIG="$PKG_CONFIG" ../configure \
              --cross-prefix="$CROSS_WRAPPERS/" \
              --cpu=aarch64 \
              --target-list=aarch64-softmmu \
              --host-cc=gcc \
              --disable-werror \
              --disable-docs --disable-guest-agent --disable-tools \
              --disable-gtk --disable-sdl --disable-vnc --disable-opengl \
              --disable-spice --disable-glusterfs --disable-libssh --disable-capstone \
              --disable-slirp --disable-kvm --disable-curl --disable-libiscsi \
              --disable-libnfs --disable-smartcard --disable-usb-redir --disable-u2f \
              --disable-seccomp --disable-xen --disable-brlapi --disable-curses \
              --disable-vte --disable-pipewire --disable-jack --disable-oss \
              --disable-alsa --disable-vhost-user --disable-vhost-crypto \
              --disable-vhost-vdpa --disable-vhost-net --disable-vhost-kernel \
              --disable-libvduse --disable-virtfs --enable-pie
            echo "---- Termux GLib target metadata ----"
            "$PKG_CONFIG" --cflags glib-2.0
            "$PKG_CONFIG" --variable=prefix glib-2.0
            grep -R "GLIB_SIZEOF_SIZE_T" "$SYSROOT/data/data/com.termux/files/usr/include/glib-2.0" "$SYSROOT/data/data/com.termux/files/usr/lib/glib-2.0/include" 2>/dev/null || true
            configure_status=$?
            if [ "$configure_status" -ne 0 ]; then
              echo "QEMU configure failed with exit code $configure_status"
              if [ -f meson-logs/meson-log.txt ]; then
                echo "---- Meson diagnostic log ----"
                tail -n 180 meson-logs/meson-log.txt
              fi
              false
            else
              ninja -j2 qemu-system-aarch64
              build_status=$?
              if [ "$build_status" -ne 0 ]; then
                echo "QEMU build failed with exit code $build_status"
                false
              else
                file qemu-system-aarch64
                "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d qemu-system-aarch64
              fi
            fi
          } > ../qemu-configure-build.log 2>&1
          result=$?
          echo "QEMU configure/build exit code: $result"
          echo "---- relevant diagnostics ----"
          grep -nEi 'error:|fatal:|failed|not found|undefined reference|cannot find|unsupported|configure: error|ninja: build stopped' ../qemu-configure-build.log | tail -n 100 || true
          echo "---- final log lines ----"
          tail -n 100 ../qemu-configure-build.log
          exit "$result"

      - name: Stage Android engine assets
        run: |
          set -euo pipefail
          DEST=android/app/src/main/assets/engine/arm64-v8a
          mkdir -p "$DEST"
          cp qemu/build-android/qemu-system-aarch64 "$DEST/"
          LIBDIR=/tmp/termux-root/data/data/com.termux/files/usr/lib
          find "$LIBDIR" -maxdepth 1 -type f -o -type l | while read -r f; do
            case "$f" in
              *.so|*.so.*) cp -L "$f" "$DEST/$(basename "$f")" ;;
            esac
          done
          ls -lh "$DEST"
          du -sh "$DEST"

      - name: Download XNU QEMU payload
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sweet-qemu-payload
          path: /tmp/sweet-qemu-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle boot payload
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: |
          mkdir -p android/app/src/main/assets/demo
          cp /tmp/sweet-qemu-payload/sweet-qemu-payload.bin android/app/src/main/assets/demo/payload.bin
          ls -lh android/app/src/main/assets/demo/payload.bin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android APK with QEMU engine
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vms-android-arm64-with-qemu
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/src/main/assets/engine/arm64-v8a/
          retention-days: 14

      - name: Upload QEMU build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-android-build-log
          path: qemu/qemu-configure-build.log
          retention-days: 7
