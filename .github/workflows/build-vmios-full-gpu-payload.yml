name: Build upstream-faithful Android GPU payload

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-vmios-full-gpu-payload.yml"

permissions:
  actions: read
  contents: read

jobs:
  payload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the successful original XNU/QEMU build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42450246192 \
            --repo "$GITHUB_REPOSITORY" \
            --name vmios-original-xnu-and-qemu-payload \
            --dir /tmp/upstream
          test -s /tmp/upstream/kernel.development.sweet.qemu
          shasum -a 256 /tmp/upstream/kernel.development.sweet.qemu

      - name: Install upstream plugin linker and IPSW utility
        run: |
          set -euo pipefail
          brew install llvm lld
          brew install blacktop/tap/ipsw
          test -x "$(brew --prefix lld)/bin/ld64.lld"
          ipsw version
          xcodebuild -version

      - name: Build the original SweetMetalAccel plugin bundle
        run: |
          set -euo pipefail
          LD="$(brew --prefix lld)/bin/ld64.lld" \
            CLANG="$(xcrun --find clang)" \
            bash tools/build-sweetmetal.sh
          test -s vm/metal/build/SweetMetalAccel.sgb
          python3 tools/gpu-bundle.py list vm/metal/build/SweetMetalAccel.sgb

      - name: Extract the original D22AP product node from iOS 16.7.16
        run: |
          set -euo pipefail
          mkdir -p research/ipsw-x/dt
          python3 - <<'PY' > /tmp/ipsw-url
          import json, urllib.request
          data = json.load(urllib.request.urlopen(
              "https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw", timeout=60))
          matches = [x for x in data["firmwares"] if x.get("buildid") == "20H392"]
          if not matches:
              raise SystemExit("iPhone10,3 build 20H392 was not found")
          print(matches[0]["url"])
          PY
          python3 tools/remotezip.py "$(cat /tmp/ipsw-url)" \
            DeviceTree.d22ap.im4p research/ipsw-x/dt
          ipsw img4 im4p extract \
            research/ipsw-x/dt/Firmware/all_flash/DeviceTree.d22ap.im4p \
            -o research/ipsw-x/d22ap.adt
          test -s research/ipsw-x/d22ap.adt

      - name: Build the full QEMU GPU ADT and payload
        run: |
          set -euo pipefail
          python3 tools/mkadt.py qemu-gpu.adt \
            --qemu --qemu-cpus 2 \
            --gpu-wire \
            --canvas-width 1125 --canvas-height 2436 \
            --gpu-bundle vm/metal/build/SweetMetalAccel.sgb

          CMDLINE="$(python3 tools/bootargs.py vm --add gpu_wire=1 sweetmetal=1)"
          printf 'cmdline: %s\n' "$CMDLINE"
          python3 tools/mkpayload.py \
            /tmp/upstream/kernel.development.sweet.qemu \
            qemu-gpu.adt sweet-qemu-gpu-payload.bin \
            --cmdline "$CMDLINE"

          file qemu-gpu.adt sweet-qemu-gpu-payload.bin
          shasum -a 256 \
            /tmp/upstream/kernel.development.sweet.qemu \
            vm/metal/build/SweetMetalAccel.sgb \
            qemu-gpu.adt sweet-qemu-gpu-payload.bin

      - name: Upload the corrected standalone payload and its inputs
        uses: actions/upload-artifact@v4
        with:
          name: vmios-full-gpu-payload
          path: |
            sweet-qemu-gpu-payload.bin
            qemu-gpu.adt
            vm/metal/build/SweetMetalAccel.sgb
            /tmp/upstream/kernel.development.sweet.qemu
          if-no-files-found: error
          retention-days: 30
