name: Build upstream-faithful Android GPU payload

on:
  workflow_dispatch:
    inputs:
      xnu_run_id:
        description: Successful XNU workflow run ID (artifact name xnu-kernel)
        required: true
  push:
    branches: [ payload ]
    paths:
      - vm/metal/SweetMetal.m
      - .github/workflows/build-vmios-full-gpu-payload.yml

permissions:
  actions: read
  contents: read

jobs:
  payload:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the successful XNU kernel with its SMC PSCI conduit
        env:
          GH_TOKEN: ${{ github.token }}
          XNU_RUN_ID: ${{ github.event.inputs.xnu_run_id || '42945105533' }}
        run: |
          set -euo pipefail
          # A push can start this workflow while the matching XNU run is
          # still uploading its artifact. Wait for that exact run instead of
          # failing immediately and leaving a stale payload as the only build.
          downloaded=0
          for attempt in $(seq 1 90); do
            rm -rf /tmp/upstream
            mkdir -p /tmp/upstream
            if gh run download "$XNU_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name xnu-kernel \
              --dir /tmp/upstream; then
              downloaded=1
              break
            fi
            echo "XNU artifact not ready (attempt $attempt/90); retrying in 10s"
            sleep 10
          done
          test "$downloaded" = 1
          test -s /tmp/upstream/kernel.development.sweet
          # Keep the kernel's SMC #0 instruction: VmEngine configures QEMU's
          # PSCI conduit to SMC over QMP before continuing the paused VM.
          # Do not run patch-qemu-psci.py here: it changes SMC to HVC and
          # conflicts with the Android engine's EL1 + SMC configuration.
          shasum -a 256 /tmp/upstream/kernel.development.sweet

      - name: Install upstream plugin linker and IPSW utility
        run: |
          set -euo pipefail
          brew install llvm lld
          brew install blacktop/tap/ipsw
          test -x "$(brew --prefix lld)/bin/ld64.lld"
          ipsw version
          xcodebuild -version

      - name: Build the original SweetMetalAccel plugin bundle
        run: |
          set -euo pipefail
          LD="$(brew --prefix lld)/bin/ld64.lld" \
            CLANG="$(xcrun --find clang)" \
            bash tools/build-sweetmetal.sh
          test -s vm/metal/build/SweetMetalAccel.sgb
          python3 tools/gpu-bundle.py list vm/metal/build/SweetMetalAccel.sgb

      - name: Extract the original D22AP product node from iOS 16.7.16
        run: |
          set -euo pipefail
          mkdir -p research/ipsw-x/dt
          python3 - <<'PY' > /tmp/ipsw-url
          import json, urllib.request
          data = json.load(urllib.request.urlopen(
              "https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw", timeout=60))
          matches = [x for x in data["firmwares"] if x.get("buildid") == "20H392"]
          if not matches:
              raise SystemExit("iPhone10,3 build 20H392 was not found")
          print(matches[0]["url"])
          PY
          python3 tools/remotezip.py "$(cat /tmp/ipsw-url)" \
            DeviceTree.d22ap.im4p research/ipsw-x/dt
          ipsw img4 im4p extract \
            research/ipsw-x/dt/Firmware/all_flash/DeviceTree.d22ap.im4p \
            -o research/ipsw-x/d22ap.adt
          test -s research/ipsw-x/d22ap.adt

      - name: Build host-raster variant (Android CA compositor)
        run: |
          set -euo pipefail
          mkdir -p dist/host-raster
          LD="$(brew --prefix lld)/bin/ld64.lld" \
            CLANG="$(xcrun --find clang)" \
            bash tools/build-sweetmetal.sh
          cp vm/metal/build/SweetMetalAccel.sgb dist/host-raster/
          python3 tools/gpu-bundle.py list dist/host-raster/SweetMetalAccel.sgb

          python3 tools/mkadt.py dist/host-raster/qemu-gpu.adt \
            --qemu --qemu-cpus 4 \
            --gpu-wire \
            --canvas-width 1125 --canvas-height 2436 \
            --gpu-bundle dist/host-raster/SweetMetalAccel.sgb

          CMDLINE="$(python3 tools/bootargs.py vm --add gpu_wire=1 sweetmetal=1)"
          printf 'host-raster cmdline: %s\\n' "$CMDLINE"
          python3 tools/mkpayload.py \
            /tmp/upstream/kernel.development.sweet \
            dist/host-raster/qemu-gpu.adt \
            dist/host-raster/sweet-qemu-gpu-payload.bin \
            --cmdline "$CMDLINE"
          cp /tmp/upstream/kernel.development.sweet dist/host-raster/
          cat > dist/host-raster/TEST-MODE.txt <<'EOF'
          MODE: android-host-raster
          sweet_stage_local = 0
          Full-screen CA draw batches are submitted over GPU Wire to the Android
          CaCompositor. The Android JNI sweetraster library performs CPU rasterization.
          Presentation/staging and IOMobileFramebuffer swap remain unchanged.
          Use the same Android APK as the guest-local variant.
          EOF
          (cd dist/host-raster && shasum -a 256 \
            sweet-qemu-gpu-payload.bin qemu-gpu.adt SweetMetalAccel.sgb \
            kernel.development.sweet > SHA256SUMS)

      - name: Build guest-local variant (TCG software rasterizer)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vm/metal/SweetMetal.m")
          source = path.read_text()
          old = "static int sweet_stage_local = 0;"
          new = "static int sweet_stage_local = 1;"
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one default sweet_stage_local=0 switch")
          path.write_text(source.replace(old, new))
          PY

          mkdir -p dist/guest-local-raster
          LD="$(brew --prefix lld)/bin/ld64.lld" \
            CLANG="$(xcrun --find clang)" \
            bash tools/build-sweetmetal.sh
          cp vm/metal/build/SweetMetalAccel.sgb dist/guest-local-raster/
          python3 tools/gpu-bundle.py list dist/guest-local-raster/SweetMetalAccel.sgb

          python3 tools/mkadt.py dist/guest-local-raster/qemu-gpu.adt \
            --qemu --qemu-cpus 4 \
            --gpu-wire \
            --canvas-width 1125 --canvas-height 2436 \
            --gpu-bundle dist/guest-local-raster/SweetMetalAccel.sgb

          CMDLINE="$(python3 tools/bootargs.py vm --add gpu_wire=1 sweetmetal=1)"
          printf 'guest-local-raster cmdline: %s\\n' "$CMDLINE"
          python3 tools/mkpayload.py \
            /tmp/upstream/kernel.development.sweet \
            dist/guest-local-raster/qemu-gpu.adt \
            dist/guest-local-raster/sweet-qemu-gpu-payload.bin \
            --cmdline "$CMDLINE"
          cp /tmp/upstream/kernel.development.sweet dist/guest-local-raster/
          cat > dist/guest-local-raster/TEST-MODE.txt <<'EOF'
          MODE: guest-local-raster
          sweet_stage_local = 1
          Full-screen CA draw batches are not sent to Android; SweetMetal uses
          its Guest-side software rasterizer under QEMU/TCG.
          Staging copy and IOMobileFramebuffer swap remain unchanged.
          This mode may be substantially slower; it is a diagnostic comparison.
          Use the same Android APK as the host-raster variant.
          EOF
          (cd dist/guest-local-raster && shasum -a 256 \
            sweet-qemu-gpu-payload.bin qemu-gpu.adt SweetMetalAccel.sgb \
            kernel.development.sweet > SHA256SUMS)

      - name: Upload host-raster test files
        uses: actions/upload-artifact@v4
        with:
          name: vmios-host-raster-payload
          path: dist/host-raster/
          if-no-files-found: error
          retention-days: 30

      - name: Upload guest-local-raster test files
        uses: actions/upload-artifact@v4
        with:
          name: vmios-guest-local-raster-payload
          path: dist/guest-local-raster/
          if-no-files-found: error
          retention-days: 30
